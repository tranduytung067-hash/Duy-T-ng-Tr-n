<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Glowing Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2" />
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="bar1Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="bar2Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="bar3Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="bar4Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Line Trend Gradient -->
    <linearGradient id="trendLineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Drop Shadows & Glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#rimGrad)" stroke-width="4" />

  <!-- Grid Guidelines (Subtle) -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,6">
    <line x1="80" y1="160" x2="432" y2="160" />
    <line x1="80" y1="240" x2="432" y2="240" />
    <line x1="80" y1="320" x2="432" y2="320" />
    <line x1="80" y1="390" x2="432" y2="390" stroke-dasharray="none" stroke-width="3" opacity="0.4" />
  </g>

  <!-- Sales Bars (Biểu đồ cột số bán) -->
  <!-- Bar 1 (Leftmost / Baseline) -->
  <rect x="92" y="270" width="56" height="120" rx="14" fill="url(#bar1Grad)" filter="url(#shadow)" />
  <!-- Bar 2 -->
  <rect x="174" y="210" width="56" height="180" rx="14" fill="url(#bar2Grad)" filter="url(#shadow)" />
  <!-- Bar 3 -->
  <rect x="256" y="150" width="56" height="240" rx="14" fill="url(#bar3Grad)" filter="url(#shadow)" />
  <!-- Bar 4 (Peak Sales / Target Exceeded) -->
  <rect x="338" y="90" width="56" height="300" rx="14" fill="url(#bar4Grad)" filter="url(#shadow)" />

  <!-- Sales Growth Trendline & Arrow (Đường xu hướng tăng trưởng số bán) -->
  <path d="M 120 250 L 202 190 L 284 130 L 366 70" fill="none" stroke="url(#trendLineGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Upward Trend Arrow Head -->
  <path d="M 326 62 L 378 62 L 378 114" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Node Dots along the trendline -->
  <circle cx="120" cy="250" r="10" fill="#ffffff" stroke="#10b981" stroke-width="4" filter="url(#glow)" />
  <circle cx="202" cy="190" r="10" fill="#ffffff" stroke="#2dd4bf" stroke-width="4" filter="url(#glow)" />
  <circle cx="284" cy="130" r="10" fill="#ffffff" stroke="#38bdf8" stroke-width="4" filter="url(#glow)" />
  <circle cx="366" cy="70" r="12" fill="#fef08a" stroke="#d97706" stroke-width="4" filter="url(#glow)" />

  <!-- Mini Sparkle Badges (Top Right) -->
  <polygon points="418,60 424,74 438,80 424,86 418,100 412,86 398,80 412,74" fill="#fbbf24" opacity="0.9" />
</svg>
