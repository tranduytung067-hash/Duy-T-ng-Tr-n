<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient - Full Bleed for Maskable Icon -->
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="45%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="bar1GradM" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="bar2GradM" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="bar3GradM" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="bar4GradM" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Line Trend Gradient -->
    <linearGradient id="trendLineGradM" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <filter id="glowM" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Bleed Background -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Center Graphic Group within Android 80% Safe Zone (radius ~180px) -->
  <g transform="translate(40, 40) scale(0.84)">
    <!-- Grid Guidelines -->
    <g opacity="0.15" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,6">
      <line x1="80" y1="160" x2="432" y2="160" />
      <line x1="80" y1="240" x2="432" y2="240" />
      <line x1="80" y1="320" x2="432" y2="320" />
      <line x1="80" y1="390" x2="432" y2="390" stroke-dasharray="none" stroke-width="3" opacity="0.4" />
    </g>

    <!-- Sales Bars -->
    <rect x="92" y="270" width="56" height="120" rx="14" fill="url(#bar1GradM)" />
    <rect x="174" y="210" width="56" height="180" rx="14" fill="url(#bar2GradM)" />
    <rect x="256" y="150" width="56" height="240" rx="14" fill="url(#bar3GradM)" />
    <rect x="338" y="90" width="56" height="300" rx="14" fill="url(#bar4GradM)" />

    <!-- Trendline -->
    <path d="M 120 250 L 202 190 L 284 130 L 366 70" fill="none" stroke="url(#trendLineGradM)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowM)" />
    <path d="M 326 62 L 378 62 L 378 114" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowM)" />

    <!-- Node Dots -->
    <circle cx="120" cy="250" r="10" fill="#ffffff" stroke="#10b981" stroke-width="4" filter="url(#glowM)" />
    <circle cx="202" cy="190" r="10" fill="#ffffff" stroke="#2dd4bf" stroke-width="4" filter="url(#glowM)" />
    <circle cx="284" cy="130" r="10" fill="#ffffff" stroke="#38bdf8" stroke-width="4" filter="url(#glowM)" />
    <circle cx="366" cy="70" r="12" fill="#fef08a" stroke="#d97706" stroke-width="4" filter="url(#glowM)" />
  </g>
</svg>
